<
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Email Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #243b64;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 170px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 22px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .spam {
            background: #fee2e2;
            color: #b91c1c;
        }

        .ham {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Spam Email Classifier</h1>

        <p class="subtitle">
            Check whether an email message is Spam or Not Spam
            using Machine Learning.
        </p>

        <form method="POST" action="/">
            <label for="email">Enter your email message</label>

            <textarea
                id="email"
                name="email"
                placeholder="Paste your email message here..."
                required
            >{{ email_text or '' }}</textarea>

            <button type="submit">Check Email</button>
        </form>

        {% if prediction %}
            <div class="result {% if 'Spam Email' in prediction %}spam{% else %}ham{% endif %}">
                Prediction: {{ prediction }}
            </div>
        {% endif %}

        <p class="footer">
            Powered by Python, Flask and Machine Learning
        </p>
    </main>
</body>
</html>
